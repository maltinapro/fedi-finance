# Local development stack: PostgreSQL, Keycloak, S3 (SeaweedFS), PDFCraft (+ Valkey).
# Start with `make dev` from the repository root. Credentials are for local development only.
name: fedifinance-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fedifinance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fedifinance-dev}
      POSTGRES_DB: fedifinance
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fedifinance -d fedifinance"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

  # S3-compatible object storage (SeaweedFS, Apache-2.0). Stands in for the backup target of E13;
  # the MinIO community images are no longer published.
  s3:
    image: chrislusf/seaweedfs:4.54
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: fedifinance
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-fedifinance-dev}
      S3_BUCKET: fedifinance
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9-alpine
    # Append-only file: PDFCraft tokens survive restarts
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pdfcraft:
    # Pinned version, keep in sync with docs/pdfcraft.md and the Helm chart
    image: ghcr.io/maltinapro/pdfcraft-backend:${PDFCRAFT_VERSION:-0.31.0}
    environment:
      VALKEY_URL: redis://valkey:6379
      # Tokens without watermark are "purchased" tokens; Mollie, checkout and Anubis stay off
      PAID_TOKENS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ""
    ports:
      - "127.0.0.1:${PDFCRAFT_PORT:-3000}:3000"
    depends_on:
      valkey:
        condition: service_healthy

volumes:
  postgres-data:
  keycloak-data:
  s3-data:
  valkey-data:
