name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace

  # Advisories, licenses (open source only), duplicate crates and sources (backend/deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml
          command: check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Only shipped (production) dependencies fail the build: build/test tooling advisories without a patched
      # release (e.g. picomatch GHSA-fc5q-39xc-vjpf, dev-only) would otherwise block every PR. Renovate tracks the rest.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/fedifinance
      - run: helm template ci deploy/helm/fedifinance > /dev/null

  # The dev stack must stay valid (`make dev` is the documented entry point).
  dev-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/dev/compose.yaml --project-directory deploy/dev config --quiet
      - run: bash -n deploy/dev/init-pdfcraft-token.sh deploy/dev/check-pdfcraft.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Relative links between Markdown files (README, AGENTS.md, docs/); external links are not checked
  # to keep the job stable.
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path frontend/node_modules '**/*.md'
          fail: true
